# dsh-swarm 组合层：施加在 dsh-base 之后。
# 先 disabled 关掉与团队工具冲突的 legacy 直属委派行，再 insert **仅 dsh-swarm 自身**的包行。
# 行序不承载加载语义，激活由服务可用性驱动（plugin-dev-guide §3.2）。
#
# 说明：原生团队域（agent-team / tool-agent-team）由
# `@deepseek-ai/dsh-experimental-agent-team-profile@0.2.1-rc.3` 提供，本 bundle **不重复插入**
# （P6-e2e-profile 实测发现重复行；此处收敛以避免潜在重复 id 歧义）。

# —— 关闭 legacy 直属委派行（对齐 agent-team-profile 的处理）——
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true

- insert:
    # —— dsh-swarm：端口 + 协作内核补全（原生团队域由 agent-team-profile 提供，不在此重复）——
    - id: team-core
      name: '@elinpf/dsh-swarm-team-core'
      config:
        backend: auto
        maxMembers: 8
        maxTasks: 256
        maxMessageBytes: 65536

    - id: team-prompt
      name: '@elinpf/dsh-swarm-team-prompt'
      config:
        locales: cn
        leaderProgressiveDisclosure: true

    - id: team-bus
      name: '@elinpf/dsh-swarm-team-bus'
      config:
        maxFanout: 64
        maxMessageBytes: 65536

    - id: team-review
      name: '@elinpf/dsh-swarm-team-review'
      config:
        pools:
          - { kind: binary, rule: veto, roles: [verifier, challenger] }
        maxRounds: 3
        stallTimeoutMs: 1800000

    - id: team-scheduler
      name: '@elinpf/dsh-swarm-team-scheduler'
      config:
        mode: autonomous
        pollMs: 30000

    - id: team-completion
      name: '@elinpf/dsh-swarm-team-completion'
      config:
        blockOnUnread: true

    - id: tool-swarm
      name: '@elinpf/dsh-swarm-tool-swarm'
      config:
        enableBroadcast: true
        enableReview: false
